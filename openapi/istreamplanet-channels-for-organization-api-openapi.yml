                                type: string
                              magazine:
                                description: The teletext magazine number where the subtitles are found. In a conventional 3-digit Teletext page number, this is the first digit. E.g., in 'page 123', the magazine number is 1. 'Magazine 0' and 'magazine 8' are interchangeable and refer to the same thing. magazine + page configuration is mutually exclusive with language + type configuration.
                                examples:
