              enum:
              - ATSC_A53
              - SMPTE_2038
              type: string
            id:
              description: Unique identifier for this source.
              examples:
              - s-examplej95ah2qab
              type: string
            self:
              description: Self link for the source.
              format: uri-reference
              type: string
            video_source:
              additionalProperties: false
              properties:
                dynamic_range:
                  description: The highest dynamic range the source will ever send to the transcoder.
                  enum:
                  - SDR
                  - HDR
                  type: string
                jpeg_xs:
                  description: If true, the source may be JPEG-XS. Enables allocation of additional resources required to handle the higher bitrate and decode JPEG-XS. If not enabled, JPEG-XS inputs will result in the source-loss slate.
                  type: boolean
                max_resolution:
                  description: The maximum resolution the source will ever send to the transcoder.
                  enum:
                  - SD
                  - HD
                  - FHD
                  - TwoK
                  - QHD
                  - UHD
                  type: string
              type: object
