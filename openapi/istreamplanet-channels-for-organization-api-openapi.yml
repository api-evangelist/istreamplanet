openapi: 3.2.0
info:
  contact:
    email: live-control-plane-devs@wbd.com
    name: ChannelAPI Support
    url: https://warnermedia.enterprise.slack.com/archives/C0648UND8SD
  description: This API provides a way to list, create, and run channels.
  title: WBD Aventus Channels Channels for Organization API
  version: v1.52.0
servers:
- description: prod
  url: https://api.istreamplanet.com
security:
- authcode: []
  m2m: []
tags:
- name: Channels for Organization
paths:
  /v2/{org}/channels:
    get:
      description: Get a list of your channels.
      operationId: list-org-channels
      parameters:
      - description: Organization name
        in: path
        name: org
        required: true
        schema:
          description: Organization name
          type: string
      - description: Current page cursor
        explode: false
        in: query
        name: cursor
        schema:
          description: Current page cursor
          type: string
      - description: Number of items to return
        explode: false
        in: query
        name: page_size
        schema:
          default: 100
          description: Number of items to return
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      - description: Search query to match against for filtering a list of channels. This searches the channel ID, name, labels, and source ID.
        explode: false
        in: query
        name: q
        schema:
          description: Search query to match against for filtering a list of channels. This searches the channel ID, name, labels, and source ID.
          maxLength: 256
          minLength: 3
          pattern: ^[\w -]+$
          type: string
      - description: List channels that are ON or OFF
        explode: false
        in: query
        name: desired_state
        schema:
          description: List channels that are ON or OFF
          enum:
          - 'ON'
          - 'OFF'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Summary'
                type:
                - array
                - 'null'
          description: OK
          headers:
            Link:
              schema:
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unauthorized
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '499':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Service Unavailable
      summary: List channels
      tags:
      - Channels for Organization
  /v2/{org}/channels/{channel-id}:
    delete:
      description: 'Delete a channel and stop publishing. This action is idempotent.


        End distributions are automatically sent when attempting to delete an `ON` channel. To delete a channel without sending end distribution:

        1. The channel''s DesiredState must be updated to `OFF`See put-org-channel-desired-state for more details.

        2. Once the channel is `OFF`, the channel can be deleted with the flag`--end_playlist=false`.'
      operationId: delete-org-channel
      parameters:
      - description: Organization name
        in: path
        name: org
        required: true
        schema:
          description: Organization name
          type: string
      - description: Unique channel identifier
        in: path
        name: channel-id
        required: true
        schema:
          description: Unique channel identifier
          maxLength: 60
          pattern: ^([a-z0-9]+(-*[a-z0-9]+)*)$
          type: string
      - description: Succeeds if the server's resource matches one of the passed values.
        in: header
        name: If-Match
        schema:
          description: Succeeds if the server's resource matches one of the passed values.
          items:
            type: string
          type:
          - array
          - 'null'
      - description: Succeeds if the server's resource matches none of the passed values. On writes, the special value * may be used to match any existing value.
        in: header
        name: If-None-Match
        schema:
          description: Succeeds if the server's resource matches none of the passed values. On writes, the special value * may be used to match any existing value.
          items:
            type: string
          type:
          - array
          - 'null'
      - description: Succeeds if the server's resource date is more recent than the passed date.
        in: header
        name: If-Modified-Since
        schema:
          description: Succeeds if the server's resource date is more recent than the passed date.
          format: date-time-http
          type: string
      - description: Succeeds if the server's resource date is older or the same as the passed date.
        in: header
        name: If-Unmodified-Since
        schema:
          description: Succeeds if the server's resource date is older or the same as the passed date.
          format: date-time-http
          type: string
      responses:
        '204':
          description: No Content
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unauthorized
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Conflict
        '412':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Precondition Failed
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '499':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Service Unavailable
      summary: Delete channel
      tags:
      - Channels for Organization
    get:
      description: Get a channel's configuration
      operationId: get-org-channel
      parameters:
      - description: Organization name
        in: path
        name: org
        required: true
        schema:
          description: Organization name
          type: string
      - description: Unique channel identifier
        in: path
        name: channel-id
        required: true
        schema:
          description: Unique channel identifier
          maxLength: 60
          pattern: ^([a-z0-9]+(-*[a-z0-9]+)*)$
          type: string
      - description: Succeeds if the server's resource matches one of the passed values.
        in: header
        name: If-Match
        schema:
          description: Succeeds if the server's resource matches one of the passed values.
          items:
            type: string
          type:
          - array
          - 'null'
      - description: Succeeds if the server's resource matches none of the passed values. On writes, the special value * may be used to match any existing value.
        in: header
        name: If-None-Match
        schema:
          description: Succeeds if the server's resource matches none of the passed values. On writes, the special value * may be used to match any existing value.
          items:
            type: string
          type:
          - array
          - 'null'
      - description: Succeeds if the server's resource date is more recent than the passed date.
        in: header
        name: If-Modified-Since
        schema:
          description: Succeeds if the server's resource date is more recent than the passed date.
          format: date-time-http
          type: string
      - description: Succeeds if the server's resource date is older or the same as the passed date.
        in: header
        name: If-Unmodified-Since
        schema:
          description: Succeeds if the server's resource date is older or the same as the passed date.
          format: date-time-http
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
        '304':
          description: Not Modified
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unauthorized
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '499':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Service Unavailable
      summary: Get Channel
      tags:
      - Channels for Organization
    patch:
      description: Partial update operation supporting both JSON Merge Patch & JSON Patch updates.
      operationId: patch-org-channel
      parameters:
      - description: Organization name
        in: path
        name: org
        required: true
        schema:
          description: Organization name
          type: string
      - description: Unique channel identifier
        in: path
        name: channel-id
        required: true
        schema:
          description: Unique channel identifier
          maxLength: 60
          pattern: ^([a-z0-9]+(-*[a-z0-9]+)*)$
          type: string
      - description: Validate request but do not otherwise process it
        explode: false
        in: query
        name: validate_only
        schema:
          description: Validate request but do not otherwise process it
          type: boolean
      - description: Succeeds if the server's resource matches one of the passed values.
        in: header
        name: If-Match
        schema:
          description: Succeeds if the server's resource matches one of the passed values.
          items:
            type: string
          type:
          - array
          - 'null'
      - description: Succeeds if the server's resource matches none of the passed values. On writes, the special value * may be used to match any existing value.
        in: header
        name: If-None-Match
        schema:
          description: Succeeds if the server's resource matches none of the passed values. On writes, the special value * may be used to match any existing value.
          items:
            type: string
          type:
          - array
          - 'null'
      - description: Succeeds if the server's resource date is more recent than the passed date.
        in: header
        name: If-Modified-Since
        schema:
          description: Succeeds if the server's resource date is more recent than the passed date.
          format: date-time-http
          type: string
      - description: Succeeds if the server's resource date is older or the same as the passed date.
        in: header
        name: If-Unmodified-Since
        schema:
          description: Succeeds if the server's resource date is older or the same as the passed date.
          format: date-time-http
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              items:
                $ref: '#/components/schemas/JsonPatchOp'
              type:
              - array
              - 'null'
          application/merge-patch+json:
            schema:
              additionalProperties: false
              properties:
                $schema:
                  description: A URL to the JSON Schema for this object.
                  examples:
                  - https://api.istreamplanet.com/schemas/PutChannelRequestBody.json
                  format: uri
                  readOnly: true
                  type: string
                created:
                  description: Date and time the channel was created.
                  format: date-time
                  type: string
                description:
                  description: A human-readable description of the channel.
                  type: string
                desired_state:
                  description: Desired running state for a channel.
                  enum:
                  - 'ON'
                  - 'OFF'
                  type: string
                enable_byoip:
                  description: Indicates whether the channel's transcoder needs to run in a designated IP range.
                  type: boolean
                id:
                  description: External Channel ID provided at channel creation time
                  examples:
                  - my-channel
                  minLength: 1
                  pattern: ^([a-z0-9]+(-*[a-z0-9]+)*)$
                  type: string
                ingest:
                  additionalProperties: false
                  properties:
                    slate:
                      additionalProperties: false
                      properties:
                        source_loss_url:
                          description: Source loss URL defines the location of the TS file to play when no source is available. It must have one audio and one video stream. Either MPEG2 or H.264 can be used.
                          examples:
                          - https://example.com/slate.ts
                          format: uri-reference
                          type: string
                      type: object
                    source:
                      additionalProperties: false
                      properties:
                        audio_sources:
                          items:
                            additionalProperties: false
                            properties:
                              id:
                                minLength: 1
                                type: string
                              language:
                                description: RFC 5646, e.g. 'en' 'en-US'
                                minLength: 1
                                type: string
                              license:
                                description: License specifies how the audio in this source is licensed. If license is not AUDIO_LICENSE_UNSPECIFIED, any remapped AudioSource which names this AudioSource in its remapping table must have the same license value as this AudioSource.
                                enum:
                                - LIVE
                                - REPLAY
                                type: string
                              name:
                                description: Language fiendly name, e.g. 'English', 'Spanish'
                                minLength: 1
                                type: string
                              remapping:
                                additionalProperties: false
                                properties:
                                  back_left:
                                    additionalProperties: false
                                    properties:
                                      audio_source_id:
                                        description: Identifies the ID of the elementary audio source from which this channel will be sourced.
                                        minLength: 1
                                        type: string
                                      channel_index:
                                        description: 'Identifies the zero-based channel index within the audio decoded from audio_source_id which is used for this channel mapping. If this index is out of bounds, the audio for this channel will be silent. For SMPTE-302M inputs, channel indices are always in the range 0-8 (unless the Aventus-specific extension for carrying more than 8 channels in one elementary stream is in use) and name the Nth channel of the input. I.e., the base channel index indicated by the input stream is ignored. For non-SMPTE-302M inputs with 1, 2, or 6 channels, the following index-to-channel mapping always applies: - 0 is front left (i.e. the only channel for mono) - 1 is front right - 2 is front center - 3 is LFE - 4 is side left - 5 is side right For non-SMPTE-302M inputs with 3, 4, or 5 channels, no index mapping is guaranteed. For non-SMPTE-302M inputs with more than 6 channels, the index mapping that would be used for 6 channels is guaranteed, and no specific mapping for the other channels is guaranteed.'
                                        format: int32
                                        minimum: 0
                                        type: integer
                                    type: object
                                  back_right: {}
                                  front_center: {}
                                  front_left: {}
                                  front_right: {}
                                  low_frequency: {}
                                  side_left: {}
                                  side_right: {}
                                  top_back_left: {}
                                  top_back_right: {}
                                  top_front_left: {}
                                  top_front_right: {}
                                  top_side_left: {}
                                  top_side_right: {}
                                  wide_left: {}
                                  wide_right: {}
                                type: object
                              selector:
                                description: Expression for choosing an audio track in the stream for this AudioSource https://wbdstreaming.atlassian.net/wiki/spaces/LIVE/pages/250351679/Proposal+Audio+Track+Selection An AudioSource which specifies a selector is an 'elementary audio source' which corresponds to exactly one elementary stream in the input.
                                type: string
                            type: object
                          minItems: 1
                          type: array
                        captions_source:
                          description: Closed captions source embedding. If unspecified, defaults to ATSC_A53.
                          enum:
                          - ATSC_A53
                          - SMPTE_2038
                          type: string
                        id:
                          description: Unique identifier for this source.
                          examples:
                          - s-examplej95ah2qab
                          type: string
                        self:
                          description: Self link for the source.
                          format: uri-reference
                          type: string
                        video_source:
                          additionalProperties: false
                          properties:
                            dynamic_range:
                              description: The highest dynamic range the source will ever send to the transcoder.
                              enum:
                              - SDR
                              - HDR
                              type: string
                            jpeg_xs:
                              description: If true, the source may be JPEG-XS. Enables allocation of additional resources required to handle the higher bitrate and decode JPEG-XS. If not enabled, JPEG-XS inputs will result in the source-loss slate.
                              type: boolean
                            max_resolution:
                              description: The maximum resolution the source will ever send to the transcoder.
                              enum:
                              - SD
                              - HD
                              - FHD
                              - TwoK
                              - QHD
                              - UHD
                              type: string
                          type: object
                      type: object
                  type: object
                labels:
                  description: Optional labels for a channel. Any included labels must be at least 1 character long, but no greater than 256 characters. The maximum number of labels is 50.
                  items:
                    type: string
                  maxItems: 50
                  type: array
                modified:
                  description: Date and time the channel was last modified.
                  format: date-time
                  type: string
                name:
                  description: A friendly human-readable name for the channel. This will get displayed in user interfaces.
                  examples:
                  - My Channel
                  type: string
                organization:
                  minLength: 1
                  type: string
                packaging:
                  additionalProperties: false
                  properties:
                    packagers:
                      additionalProperties:
                        additionalProperties: false
                        properties:
                          content_protection:
                            additionalProperties: false
                            properties:
                              atlas:
                                additionalProperties: false
                                properties:
                                  asset_id:
                                    description: The Asset Identifier which was taken from the token entitlement service request.
                                    type: string
                                  company_id:
                                    description: The Identifier of the Company that this token belongs.
                                    type: string
                                  drms:
                                    description: DRM system keys to request
                                    items:
                                      enum:
                                      - WIDEVINE
                                      - FAIRPLAY
                                      - PRIMETIME
                                      - PLAYREADY
                                      - W3C_COMMON_CLEAR_KEY
                                      - BULK_FILE
                                      type: string
                                    type:
                                    - array
                                    - 'null'
                                    uniqueItems: true
                                  widevine_v0_pssh_box:
                                    description: When TRUE the KeyID is not embedded in the pssh box which sets the version to 0. Defaults to generating v1 pssh_boxes that includes the key_id
                                    type: boolean
                                type: object
                              bulk_file:
                                additionalProperties: false
                                properties:
                                  iv_rotation:
                                    description: How often the IV should be rotated and how it should be created
                                    enum:
                                    - RANDOM_PER_KEY
                                    - PER_SEGMENT_NUMBER
                                    - UNIQUE_PER_SEGMENT
                                    type: string
                                type: object
                              common:
                                additionalProperties: false
                                properties:
                                  scheme_type:
                                    description: Defines the scheme that can be used with Common Encryption
                                    enum:
                                    - CENC
                                    - CBCS
                                    type: string
                                type: object
                              cpix:
                                additionalProperties: false
                                properties:
                                  certificates_id:
                                    description: Unique ID used for certificate settings, unique per distributor.
                                    type: string
                                  content_id:
                                    description: (Optional) Content ID that identifies this channel in the CPIX service. Value is defined by the DRM system owner, and if defined will be included as part of a POST request.
                                    type: string
                                  credentials_id:
                                    description: Unique ID used for credentials settings, unique per distributor.
                                    type: string
                                  decryption_key_id:
                                    description: Unique ID of the decryption key to use in case the server response contains content keys encrypted. The key is unique per distirutor, and configured ahead of time by the publishing team and the CPIX service owner.
                                    type: string
                                  drms:
                                    description: (Optional) DRM system keys to request. If not defined a GET request will be done, and any key returned will be handled. If defined, random kid(s) (key ids) will be generated on rotation for each DRM system, and a POST request will be done to create them.
                                    items:
                                      enum:
                                      - WIDEVINE
                                      - FAIRPLAY
                                      - PRIMETIME
                                      - PLAYREADY
                                      - W3C_COMMON_CLEAR_KEY
                                      - BULK_FILE
                                      type: string
                                    type:
                                    - array
                                    - 'null'
                                    uniqueItems: true
                                  headers_id:
                                    description: (Optional) An identifier to a list of HTTP headers to be added to the request sent to the CPIX service.
                                    type: string
                                  uri:
                                    description: CPIX service URI
                                    format: uri-reference
                                    minLength: 1
                                    type: string
                                type: object
                              key_rotation:
                                additionalProperties: false
                                properties:
                                  interval_secs:
                                    description: Rotate keys based on the specified time interval. If Program is also provided then this time interval will only apply to media segments that are outside of program boundaries. If Program is NOT provided then only this time interval will be used to decided when to rotate keys.
                                    format: float
                                    minimum: 300
                                    type: number
                                  program:
                                    description: Rotate keys on (SCTE35) program boundaries such that no two programs will be protected with the same key.
                                    type: boolean
                                  program_overlap_skip_encrypt:
                                    description: Do not encrypt segments that are part of more than one SCTE-35 program.
                                    type: boolean
                                type: object
                              sample_aes:
                                additionalProperties: false
                                type: object
                              simple:
                                additionalProperties: false
                                properties:
                                  publish_points:
                                    description: Pub points where keys should be published. If multiple are specified, only one needs to succeed to consider the key successfully published.
                                    items:
                                      additionalProperties: false
                                      properties:
                                        basic_auth:
                                          additionalProperties: false
                                          properties:
                                            password:
                                              description: Plain text password for basic auth.
                                              type: string
                                            username:
                                              description: Username for basic auth.
                                              type: string
                                          type: object
                                        compression:
                                          description: Configures whether or not (and how) to compress manifests being published to the origin. If not specified, manifests will not be compressed.
                                          enum:
                                          - NONE
                                          - GZIP
                                          type: string
                                        do_not_monitor:
                                          description: (Optional) Specifies if this pubpoint should not be monitored by PLM.
                                          type: boolean
                                        headers:
                                          additionalProperties:
                                            type: string
                                          description: Allows custom HTTP headers to be set via configuration for all HTTP requests.
                                          type: object
                                        method:
                                          description: Method overrides what HTTP method to specify in requests to the Publish Point. If not specified the service will default to POST.
                                          type: string
                                        playback_base_url:
                                          description: The base URL where published playlists will be able to be obtained. This is often different than the publish_base_url for CDN publishing workflows.
                                          format: uri-reference
                                          type: string
                                        playback_query_params:
                                          description: 'Specifies any query parameters that will be added to playback urls. Should not include the initial ''?'' Example: ''foo=bar&q=golang'''
                                          type: string
                                        publish_base_url:
                                          description: The base URL where generated playlists will be sent/published. Each publish point requires a unique 'publish_base_url'.
                                          format: uri-reference
                                          type: string
                                        secure_header_auth:
                                          additionalProperties: false
                                          properties:
                                            arn:
                                              description: arn is the AWS Secret ARN that contains the secure header list to be applied.
                                              type: string
                                            version_id:
                                              description: version_id is the AWS Secret's version ID that contains the version of the secret to be applied.
                                              type: string
                                          type: object
                                      type: object
                                    type:
                                    - array
                                    - 'null'
                                  require_publish:
                                    description: Indicates which publish points must succeed for segment publishing to use the keys.
                                    enum:
                                    - ANY
                                    - ALL
                                    type: string
                                type: object
                            type: object
                          mp2t:
                            additionalProperties: false
                            properties:
                              force_unmuxed_audio:
                                description: Forces the Video and Audio Encodings to be unmuxed when there is one audio encodings. This setting will have to be uniformed across MP2T packagers within a config. When there are two or more audio encodings, unmuxed will be used automatically.
                                type: boolean
                              insert_id3_utc_time:
                                description: If true, insert ID3 tags that include a UTC timestamp. This is a Turner/WM-specific extension.
                                type: boolean
                            type: object
                          mp4:
                            additionalProperties: false
                            properties:
                              caption_placement:
                                description: CaptionPlacement defines where caption messages should be placed in the output MP4.
                                enum:
                                - SEI_PAYLOAD
                                - CLCP_TRACK
                                type: string
                              insert_pssh_box:
                                description: Insert pssh boxes generated by content protection into packaged segments. Defaults to not insert pssh boxes to the packaged segments.
                                type: boolean
                            type: object
                          ttml:
                            additionalProperties: false
                            type: object
                          web_vtt:
                            additionalProperties: false
                            properties:
                              file_format:
                                description: The file format used to encapsulate the WebVTT segments.
                                enum:
                                - TEXT
                                - MP4
                                type: string
                            type: object
                        type: object
                      description: Defines the list of packagers available for Publications.
                      type: object
                  type: object
                publishing:
                  additionalProperties: false
                  properties:
                    closed_caption_streams:
                      description: Configures how captioning information, which references CEA-608 captions embedded in video segments, is published.
                      items:
                        additionalProperties: false
                        properties:
                          auto_select:
