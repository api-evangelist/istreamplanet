                                format: int32
                                maximum: 8
                                minimum: 0
                                type: integer
                              page:
                                description: The teletext page number where the subtitles are found. In a conventional 3-digit Teletext page number, this is the second two digits, *after interpreting those digits as hex*. E.g., in 'page 123', the page number is 35 (0x23). magazine + page configuration is mutually exclusive with language + type configuration.
                                examples:
                                - 170
                                format: int32
                                maximum: 255
                                minimum: 0
                                type: integer
                              page_type:
                                description: 'The Teletext page type declared in the Teletext descriptor in the source PMT. If this field is unset, it will be inferred from the ''usage'' field on the SubtitleEncoder using this table: SubtitleEncoder.CLOSED_CAPTIONS => TeletextSource.PAGE_TYPE_SUBTITLE_HEARING_IMPAIRED SubtitleEncoder.SUBTITLES => TeletextSource.PAGE_TYPE_SUBTITLE'
                                enum:
