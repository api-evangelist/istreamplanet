                              uniqueItems: true
                            drm_system_ids:
                              description: 'Specify which DRMs to advertise in the playlist. If specified, this must be a subset of the DRMs specified by the packager associated with this origin. If omitted or empty, all DRMs specified by the packager will be advertised. Only honored for Alternate Manifests. Example: ''81376844-f976-481e-a84e-cc25d39b0b33'' for bulk file encryption ID'
                              items:
                                type: string
                              type:
                              - array
