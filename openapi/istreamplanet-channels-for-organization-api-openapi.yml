                                $ref: '#/components/schemas/HdrSettingsContentLightLevelInfo'
                              mdcv:
                                $ref: '#/components/schemas/HdrSettingsMasteringDisplayColorVolume'
                            type: object
                        type: object
                    type: object
                  bit_rate:
                    description: Bit rate specifies the number in bits used per second. Higher values result in better video quality but bigger file sizes. For H.264 this value is the target of the constrained variable bit rate.
                    examples:
                    - 6000000
                    exclusiveMinimum: 1000
                    format: int32
