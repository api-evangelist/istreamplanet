                      wide_left:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      wide_right:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                    type: object
                  selector:
                    description: Expression for choosing an audio track in the stream for this AudioSource https://wbdstreaming.atlassian.net/wiki/spaces/LIVE/pages/250351679/Proposal+Audio+Track+Selection An AudioSource which specifies a selector is an 'elementary audio source' which corresponds to exactly one elementary stream in the input.
                    type: string
