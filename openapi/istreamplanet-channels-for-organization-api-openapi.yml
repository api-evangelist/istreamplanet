                                    minimum: 0
                                    type: integer
                                  y:
                                    description: 'Y coordinate as a percent of the display height where the caption should be placed. If < 50 the caption will be top anchored. If > 50 it will be bottom anchored. If exactly 50, the caption will be vertically centered. 0 means use default. Example: y = 40, rows = 3. The top of the caption area will be approximately 40% the video height from the top of the screen, and will be 3 lines tall. Example: y = 75, rows = 2. The bottom of the caption area will be approximately 25% the video height from the bottom of the screen, and will be 2 lines tall.'
                                    examples:
