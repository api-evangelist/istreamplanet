                        additionalProperties: false
                        properties:
                          audio_source_id:
                            description: Identifies the ID of the elementary audio source from which this channel will be sourced.
                            minLength: 1
                            type: string
                          channel_index:
                            description: 'Identifies the zero-based channel index within the audio decoded from audio_source_id which is used for this channel mapping. If this index is out of bounds, the audio for this channel will be silent. For SMPTE-302M inputs, channel indices are always in the range 0-8 (unless the Aventus-specific extension for carrying more than 8 channels in one elementary stream is in use) and name the Nth channel of the input. I.e., the base channel index indicated by the input stream is ignored. For non-SMPTE-302M inputs with 1, 2, or 6 channels, the following index-to-channel mapping always applies: - 0 is front left (i.e. the only channel for mono) - 1 is front right - 2 is front center - 3 is LFE - 4 is side left - 5 is side right For non-SMPTE-302M inputs with 3, 4, or 5 channels, no index mapping is guaranteed. For non-SMPTE-302M inputs with more than 6 channels, the index mapping that would be used for 6 channels is guaranteed, and no specific mapping for the other channels is guaranteed.'
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                      back_right:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      front_center:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      front_left:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      front_right:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      low_frequency:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      side_left:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      side_right:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      top_back_left:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      top_back_right:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      top_front_left:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      top_front_right:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      top_side_left:
