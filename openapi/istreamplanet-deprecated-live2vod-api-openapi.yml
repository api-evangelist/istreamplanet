components:
  schemas:
    DeprecatedMakeMP4Request:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/DeprecatedMakeMP4Request.json
          format: uri
          readOnly: true
          type: string
        force:
          description: if true, forces recreation of the mp4 if already created.
          type: boolean
      type: object
    DeprecatedGetProgramResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/DeprecatedGetProgramResponseBody.json
          format: uri
          readOnly: true
          type: string
        clear_segment_config:
          $ref: '#/components/schemas/ClearSegmentConfig'
        description:
          description: description of the program
          type: string
        file_count:
          description: total number off files for the program
          format: int64
          type: integer
        last_published:
          description: date last published
          format: date-time
          type: string
        progid:
          description: id for the program
          type: string
        pub_clip_id:
          description: clip id
          format: int64
          type: integer
        pub_vod_id:
          description: vod id
          format: int64
          type: integer
        retention_days:
          description: number of days to retain
          format: int64
          type: integer
        total_bytes:
          description: total bytes in the program
          format: int64
          type: integer
      required:
      - progid
      - description
      - total_bytes
      - file_count
      - last_published
      - pub_vod_id
      - pub_clip_id
      - retention_days
      - clear_segment_config
      type: object
    DeprecatedGetProgramTimeResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/DeprecatedGetProgramTimeResponseBody.json
          format: uri
