openapi: 3.2.0
info:
  title: Istreamplanet Deprecated Live2VOD API
  version: v1.52.0
  contact:
    email: live-control-plane-devs@wbd.com
    name: ChannelAPI Support
    url: https://warnermedia.enterprise.slack.com/archives/C0648UND8SD
  description: 'Operations tagged Deprecated Live2VOD across 2 of this provider''s published API definitions: istreamplanet-aventus-channels-openapi.json, istreamplanet-aventus-channels-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: prod
  url: https://api.istreamplanet.com
security:
- authcode: []
  m2m: []
tags:
- name: Deprecated Live2VOD
paths:
  /cust/{customer-id}/prod/{product-id}/prog/{program-id}:
    get:
      deprecated: true
      description: 'This route is deprecated and is subject to removal any time after `Thu, 06 Apr 2023 19:00:00 UTC`.

        Get a program with an customer, product and program id. This API is deprecated, and it only returns

        the program from the west region.'
      operationId: get-deprecated-program
      parameters:
      - description: Customer ID for a l2v request.  Used only for the deprecated legacy route support.
        in: path
        name: customer-id
        required: true
        schema:
          description: Customer ID for a l2v request.  Used only for the deprecated legacy route support.
          pattern: ^([0-9]+)$
          type: string
      - description: Product ID for a l2v request
        in: path
        name: product-id
        required: true
        schema:
          description: Product ID for a l2v request
          pattern: ^([0-9]+)$
          type: string
      - description: Program ID for a l2v request.  Used only for the deprecated legacy route support.
        in: path
        name: program-id
        required: true
        schema:
          description: Program ID for a l2v request.  Used only for the deprecated legacy route support.
          maxLength: 60
          pattern: ^([a-zA-Z0-9]+(-*[a-zA-Z0-9]+)*)$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeprecatedGetProgramResponseBody'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Bad Request
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Found
        '422':
          content:
            application/problem+json:
