paths:
  /v2/{org}/channels/{channel-id}/timeline:
    get:
      description: Returns up to twenty items from the event timeline for a channel, sorted in reverse-chronological order.
      operationId: get-org-channel-timeline
      parameters:
      - description: Organization name
        in: path
        name: org
        required: true
        schema:
          description: Organization name
          type: string
      - description: Unique channel identifier
        in: path
        name: channel-id
        required: true
        schema:
          description: Unique channel identifier
          maxLength: 60
          pattern: ^([a-z0-9]+(-*[a-z0-9]+)*)$
          type: string
      - description: Current page cursor
        explode: false
        in: query
        name: cursor
        schema:
          description: Current page cursor
          type: string
      - description: Number of items to return
        explode: false
        in: query
        name: page_size
        schema:
          default: 100
          description: Number of items to return
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ChannelTimelineEntry'
                type:
                - array
                - 'null'
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
            Link:
              schema:
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Bad Request
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
        '501':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Implemented
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Service Unavailable
      summary: Get Channel Timeline
      tags:
      - Audit Operations for Organization
