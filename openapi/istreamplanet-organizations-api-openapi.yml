openapi: 3.2.0
info:
  contact:
    email: live-control-plane-devs@wbd.com
    name: ChannelAPI Support
    url: https://warnermedia.enterprise.slack.com/archives/C0648UND8SD
  description: This API provides a way to list, create, and run channels.
  title: WBD Aventus Channels Organizations API
  version: v1.52.0
servers:
- description: prod
  url: https://api.istreamplanet.com
security:
- authcode: []
  m2m: []
tags:
- name: Organizations
paths:
  /v2/orgs:
    get:
      description: Get a list of organizations that you can access.
      operationId: list-orgs
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OrgSummary'
                type:
                - array
                - 'null'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Bad Request
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Service Unavailable
      summary: List Organizations
      tags:
      - Organizations
components:
  schemas:
    OrgSummary:
      additionalProperties: false
      properties:
        id:
          description: ID of the organization
          type: string
        self:
          description: Link to this resource
          format: uri
          readOnly: true
          type: string
      required:
      - id
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
          - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type:
          - array
          - 'null'
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
          - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
          - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
          - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
          - https://example.com/errors/example
          format: uri
          type: string
      type: object
  securitySchemes:
    authcode:
      flows:
        authorizationCode:
          authorizationUrl: https://sso.wbd.com/oauth2/aus125bl6q770za4g0x8/v1/authorize
          scopes: null
          tokenUrl: https://sso.wbd.com/oauth2/aus125bl6q770za4g0x8/v1/token
      type: oauth2
    m2m:
      flows:
        clientCredentials:
          scopes: null
          tokenUrl: https://sso.wbd.com/oauth2/aus125bl6q770za4g0x8/v1/token
      type: oauth2
x-cli-config:
  params:
    authorize_url: https://sso.wbd.com/oauth2/aus125bl6q770za4g0x8/v1/authorize
    client_id: 0oa125bj1lwLZRxjD0x8
    redirect_url: http://auth.rest.sh:8484
    scopes: offline_access,Groups
    state: non-empty
    token_url: https://sso.wbd.com/oauth2/aus125bl6q770za4g0x8/v1/token
  security: authcode
