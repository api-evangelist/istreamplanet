  /v2/{org}/channels/{channel-id}/beta/logs/signaling:
    get:
      description: 'Warning: This is deprecated beta functionality and is unstable and may change, break, or be removed in the future without notice.


        Returns the signalling history for a channel.'
      operationId: get-org-signal-logs
      parameters:
      - description: Organization name
        in: path
        name: org
        required: true
        schema:
          description: Organization name
          type: string
      - description: Unique channel identifier
        in: path
        name: channel-id
        required: true
        schema:
          description: Unique channel identifier
          maxLength: 60
          pattern: ^([a-z0-9]+(-*[a-z0-9]+)*)$
          type: string
      - description: ISO 8601 UTC timestamp for start range of date filtering
        explode: false
        in: query
        name: from
        schema:
          description: ISO 8601 UTC timestamp for start range of date filtering
          format: date-time
          type: string
      - description: ISO 8601 UTC timestamp for end range of date filtering
        explode: false
        in: query
        name: to
        schema:
          description: ISO 8601 UTC timestamp for end range of date filtering
          format: date-time
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
