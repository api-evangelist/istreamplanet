      summary: Get Signals
      tags:
      - Channel Operations for Organization
    post:
      description: 'Inserts an out-of-band signal into a channel. A signal represents a program signal like chapter-start or ad-end. Signals operate on signaling segments. For example, a chapter-start will result in a new active Chapter segment, while a chapter-end with the same event_id will end it. Signals loosely map to SCTE-35 time_signals and splice_inserts.


        The breakaway and resumption signal types are only valid with program segments.


        The required event_id identifies the active signaling segment. Use the same event_id for both start and end to reference the same segment.


        Delivery restrictions may be supplied on a signal with the delivery_restrictions field. The device_restrictions value may be undefined, none, restrict_group0, restrict_group1, or restrict_group2.


        ### Program Start


        Inserts a SCTE-35 program start message into the channel with the given event ID. Corresponding calls to end the program must use the same event ID.


        Example input body:


        ```json

        [

        {

        "event_id": 0,

        "segment_type": "program",

        "signal_type": "start"

        }

        ]

        ```


        ### Program End


        Inserts a SCTE-35 program end message into the channel with the given event ID. The event ID must match the one given during program start.


        Example input body:


        ```json

        [

        {

        "event_id": 0,

        "segment_type": "program",

        "signal_type": "end"

        }

        ]

        ```


        ### Slate In


        Replaces the current video source with a video slate. An optional duration may be passed to automatically remove the slate after some time, otherwise the slate will remain until removed via a slate out signal.


        The following table describes how video slates are supported and recommended attributes. Image slates are **NOT** supported.


        Attribute

        Supported

        Recommended


        Max File Size

        100MB (104,857,600 bytes)


        Total Duration

        Minimum: 3s

        10-30s


        Container

        MPEG-TS


        Resolution (Recommended)

        Up to 4k (2160p)

        720p


        Framerate

        25i, 25p, 29.97i, 30p, 60p

        30p


        Video Codec


        - H.264


        - H.265


        - MPEG2


        H.264 Main or High profile


        Audio Codec


        - AAC-LC


        - AC-3


        - E-AC-3


        - MPEG1|2 Audio


        48KHz AAC-LC


        Additional slate requirements:


        The slate MUST contain at least 3 seconds of supported audio and video.


        The delta between the duration of audio and video MUST be less than 3 seconds.


        The delta between the timestamps of the first audio and the first video samples MUST be less than 3 seconds.


        Audio and video duration measurement begins after the first IDR in the file.


        The MPEG2TS PMT MUST NOT change for the duration of the file.


        Ex. PIDs, audio codec, video codec, etc. must be the same throughout.


        Example input body:


        ```json

        [

        {

        "event_id": 0,

        "segment_type": "slate",

        "signal_type": "start",

        "slate_uri": "https://example.com/slate.ts"

        }

        ]

        ```


        ### Slate Out


        Removes any active slate and shows the source video content.


        Example input body:


        ```json

        [

        {

        "event_id": 0,

        "segment_type": "slate",

        "signal_type": "end"

        }

        ]

        ```


        ### Splice Insert Start


        Inserts a splice opportunity into the channel for a given duration. Can optionally include UPIDs and a slate URL to select the content to splice into the channel.


        Example input body:


        ```json

        [

        {

        "event_id": 0,

        "segment_type": "splice_insert",

        "signal_type": "start",

        "duration": 25000,

        "slate_uri": "https://example.com/slate.ts"

        }

        ]

        ```


        ### Splice Insert End


        Removes an active splice signaling segment from the channel.


        Example input body:


        ```json

        [

        {

        "event_id": 0,

        "segment_type": "splice_insert",

        "signal_type": "end"

        }

        ]

        ```'
