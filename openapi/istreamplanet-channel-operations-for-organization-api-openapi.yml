          - none
          - overlap
          - in_progress
          examples:
          - none
          type: string
        upids:
          description: UPIDs
          examples:
          - - 03:ABCD0001000H
            - 08:0A42235B81BC70FC
            - 06:0000-0001-2C52-0000-P-0000-0000-0
          items:
            type: string
          type:
          - array
          - 'null'
      required:
      - signal_type
      - segment_type
      - event_id
      type: object
    GetPreviewStreamsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/GetPreviewStreamsResponse.json
          format: uri
          readOnly: true
          type: string
        audio_tracks:
          description: 'Lists of all audio and video tracks that are available. Note: the default audio and video track info will also appear here.'
          items:
            $ref: '#/components/schemas/AudioTrackInfo'
          type:
          - array
          - 'null'
        default_audio_track:
          $ref: '#/components/schemas/AudioTrackInfo'
          description: Audio and Video Track info provided so that callers have easy access to track information of default tracks in the above default_url.
        default_url:
          description: 'default_url contains the default URL that can be used to start playback. Ex: https://example.com/cluster/org/isp/ext_id/foo/play?vid_id=2&aud_id=6 The vid_id and aud_id can be changed utilizing the ones provided by the ''audio_tracks'' and ''video_tracks'' fields to see different combinations.'
          type: string
        default_video_track:
          $ref: '#/components/schemas/VideoTrackInfo'
        token:
          description: JWT Bearer token that shall be supplied with a 'pre-flight' to myriapod.js to send the auth token to the server.
          type: string
        video_tracks:
          items:
            $ref: '#/components/schemas/VideoTrackInfo'
          type:
          - array
          - 'null'
      type: object
    TextOverlayPadding:
      additionalProperties: false
      properties:
        bottom:
          format: float
          type: number
        left:
          format: float
          type: number
        right:
          format: float
          type: number
        top:
          format: float
          type: number
      type: object
    GenericSignalResult:
      additionalProperties: false
      properties:
        error_message:
          description: Error details from the signaling subsystem
          type: string
        result_code:
          description: Result of signal; 'accepted' means no error
          enum:
          - accepted
          - not_found
          - already_exists
          - invalid_argument
          - internal_error
          examples:
          - accepted
          type: string
      required:
      - result_code
      - error_message
      type: object
    TextOverlay:
      additionalProperties: false
      properties:
        background:
          description: The background color and opacity given in RGBA hex format. Background applies to the background of both the text and the text padding.
          examples:
          - '#A2A2A2FF'
          minLength: 7
          type: string
        font_color:
          description: The font color to use for the text overlay. Given as an RGB hex string.
          examples:
          - '#FF0000'
          type: string
        font_height:
          description: The font height as a percentage of screen height.
          examples:
          - 5
          exclusiveMinimum: 0
          format: float
          type: number
        font_resource_id:
          description: The font resource id to use for the text overlay. This must reference a dynamic resource of type 'FONT'.
          examples:
          - my-font
          minLength: 1
          type: string
        padding:
          $ref: '#/components/schemas/TextOverlayPadding'
          description: The padding around the text. Used for positioning and for background.
        text:
          description: The text to overlay on the video.
          examples:
          - Hello World!
          minLength: 1
          type: string
        x:
          $ref: '#/components/schemas/Position'
          description: The horizontal position of the text overlay. Zero is the left side of the screen/overlay.
        y:
          $ref: '#/components/schemas/Position'
          description: The vertical position of the text overlay. Zero is the top of the screen/overlay.
      type: object
    IngestStatus:
      additionalProperties: false
      properties:
        primary_status:
          $ref: '#/components/schemas/SourceStatus'
          description: Primary source status.
        secondary_status:
          $ref: '#/components/schemas/SourceStatus'
          description: Secondary source status.
        source_loss_slate_status:
          $ref: '#/components/schemas/SourceStatus'
          description: Source-loss slate status.
        source_merging_active:
          description: Reports whether source merging is currently active i.e. that the transcoder is merging samples from primary and secondary sources to conceal errors.
          type: boolean
        source_merging_disabled:
          description: Reports whether source merging was disabled via API.
          type: boolean
      type: object
    IsBreakingChangeResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/IsBreakingChangeResponseBody.json
          format: uri
          readOnly: true
          type: string
        currentRevision:
          description: The current revision of the channel.
          format: int32
          type: integer
        isBreakingChange:
          description: True if the change will cause a break in user playback. False if the change will not cause a break in user playback or the channel doesn't exist
          type: boolean
      required:
      - currentRevision
      - isBreakingChange
      type: object
    PublishPointHTTP:
      additionalProperties: false
      properties:
        basic_auth:
          additionalProperties: false
          properties:
            password:
              description: Plain text password for basic auth.
              type: string
            username:
              description: Username for basic auth.
              type: string
          type: object
        compression:
          description: Configures whether or not (and how) to compress manifests being published to the origin. If not specified, manifests will not be compressed.
          enum:
          - NONE
          - GZIP
          type: string
        do_not_monitor:
          description: (Optional) Specifies if this pubpoint should not be monitored by PLM.
          type: boolean
        headers:
          additionalProperties:
            type: string
          description: Allows custom HTTP headers to be set via configuration for all HTTP requests.
          type: object
        method:
          description: Method overrides what HTTP method to specify in requests to the Publish Point. If not specified the service will default to POST.
          type: string
        playback_base_url:
          description: The base URL where published playlists will be able to be obtained. This is often different than the publish_base_url for CDN publishing workflows.
          format: uri-reference
          type: string
        playback_query_params:
          description: 'Specifies any query parameters that will be added to playback urls. Should not include the initial ''?'' Example: ''foo=bar&q=golang'''
          type: string
        publish_base_url:
          description: The base URL where generated playlists will be sent/published. Each publish point requires a unique 'publish_base_url'.
          format: uri-reference
          type: string
        secure_header_auth:
          additionalProperties: false
          properties:
            arn:
              description: arn is the AWS Secret ARN that contains the secure header list to be applied.
              type: string
            version_id:
              description: version_id is the AWS Secret's version ID that contains the version of the secret to be applied.
              type: string
          type: object
      type: object
    AudioSourceRemappingSource:
      additionalProperties: false
      properties:
        audio_source_id:
          description: Identifies the ID of the elementary audio source from which this channel will be sourced.
          minLength: 1
          type: string
        channel_index:
          description: 'Identifies the zero-based channel index within the audio decoded from audio_source_id which is used for this channel mapping. If this index is out of bounds, the audio for this channel will be silent. For SMPTE-302M inputs, channel indices are always in the range 0-8 (unless the Aventus-specific extension for carrying more than 8 channels in one elementary stream is in use) and name the Nth channel of the input. I.e., the base channel index indicated by the input stream is ignored. For non-SMPTE-302M inputs with 1, 2, or 6 channels, the following index-to-channel mapping always applies: - 0 is front left (i.e. the only channel for mono) - 1 is front right - 2 is front center - 3 is LFE - 4 is side left - 5 is side right For non-SMPTE-302M inputs with 3, 4, or 5 channels, no index mapping is guaranteed. For non-SMPTE-302M inputs with more than 6 channels, the index mapping that would be used for 6 channels is guaranteed, and no specific mapping for the other channels is guaranteed.'
          format: int32
          minimum: 0
          type: integer
      type: object
    HdrSettings:
      additionalProperties: false
      properties:
        dolby_vision:
          additionalProperties: false
          properties:
            profile101:
              additionalProperties: false
              properties:
                clli:
                  additionalProperties: false
                  properties:
                    max_cll:
                      description: Maximum Content Light Level (nits).
                      format: double
                      maximum: 10000
                      minimum: 0
                      type: number
                    max_fall:
                      description: Maximum Frame-Average Light Level (nits).
                      format: double
                      maximum: 10000
                      minimum: 0
                      type: number
                  type: object
                level8:
                  description: Configures custom Level 8 metadata. Each target may be configured at most once. Unconfigured targets use the Dolby LDP SIDK defaults.
                  items:
                    additionalProperties: false
                    properties:
                      clip_trim:
                        description: Control the clipping of whites. A positive value will clip highlights and bright whites less, while a negative value will clip more.
                        format: double
                        maximum: 1
                        minimum: -1
                        type: number
                      ms_weight_plus_one:
                        description: Amount of multiscale detail to apply. This is offset from the values used in Dolby documentation so that the Protobuf default of 0.0 corresponds to the Dolby default of -1.0. Values > 1.0 will retain more details when Dolby Vision is mapping down to a lower luminance. Values < 1.0 will lower detail contrast when Dolby Vision is mapping down to a lower luminance. The special value of 0.0 will disable multiscale detail.
                        format: double
                        maximum: 2
                        minimum: 0
                        type: number
                      target:
                        description: Identifies which Level 8 trim target is being configured.
                        enum:
                        - REC709_100NITS
                        - BT2020_600NITS
                        - BT2020_1000NITS
                        - CUSTOM
                        type: string
                      target_mid_contrast:
                        description: Controls the contrast of midtones. A positive value will increase the midtone contrast, while a negative value will decrease the midtone contrast.
                        format: double
                        maximum: 1
                        minimum: -1
                        type: number
                      trim_chroma_weight:
                        description: ChromaWeight to apply. Additional mapping for saturated colors. Higher value implies stronger effect.
                        format: double
                        maximum: 1
                        minimum: -1
                        type: number
                      trim_gain:
                        description: Gain to apply. This is a scaling factor for code values in a color component.
                        format: double
                        maximum: 1
                        minimum: -1
                        type: number
                      trim_gamma:
                        description: Gamma to apply. This is a power function in normalized code value in a color component.
                        format: double
                        maximum: 1
                        minimum: -1
                        type: number
                      trim_lift:
                        description: Lift to apply. This is an offset of code values in a color component.
                        format: double
                        maximum: 1
                        minimum: -1
                        type: number
                      trim_saturation_gain:
                        description: Saturation gain to apply. Gain on P and T components. Higher value implies stronger effect.
                        format: double
                        maximum: 1
                        minimum: -1
                        type: number
                    type: object
                  type:
                  - array
                  - 'null'
                mdcv:
                  additionalProperties: false
                  properties:
                    color_profile:
                      description: Identifies color primaries and white point.
                      enum:
                      - BT2020
                      - P3_D65
                      - BT709
                      type: string
                    max_dml:
                      description: Maximum display mastering luminance (nits). Must be greater than min_dml.
                      format: double
                      maximum: 10000
                      minimum: 0
                      type: number
                    min_dml:
                      description: Minimum display mastering luminance (nits).
                      format: double
                      maximum: 10000
                      minimum: 0
                      type: number
                  type: object
              type: object
            profile5:
              additionalProperties: false
              type: object
            profile81:
              $ref: '#/components/schemas/HdrSettingsDolbyVisionProfile81'
              description: Only one of ['profile5', 'profile81', 'profile84', 'profile101'] may be set.
            profile84:
              additionalProperties: false
              type: object
          type: object
        hdr10:
          additionalProperties: false
          properties:
            clli:
              $ref: '#/components/schemas/HdrSettingsContentLightLevelInfo'
            mdcv:
              $ref: '#/components/schemas/HdrSettingsMasteringDisplayColorVolume'
          type: object
      type: object
    Cie1931P:
      additionalProperties: false
      properties:
        x:
          format: double
          type: number
        y:
          format: double
          type: number
      type: object
    Scte35:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/Scte35.json
          format: uri
          readOnly: true
          type: string
        payload:
          contentEncoding: base64
          description: The SCTE-35 payload, encoded as base-64 in JSON or binary data in CBOR
          examples:
          - /DAvAAAAAAAAAP/wBQb/d2+7OgAZAhdDVUVJAAAD6ACACAic1fd1d2+7OjABAeo2v/g=
          type: string
      required:
      - payload
      type: object
    Channel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/Channel.json
          format: uri
          readOnly: true
          type: string
        created:
          description: Date and time the channel was created.
          format: date-time
          readOnly: true
          type: string
        description:
          description: A human-readable description of the channel.
          type: string
        desired_state:
          description: Desired running state for a channel.
          enum:
          - 'ON'
          - 'OFF'
          type: string
        enable_byoip:
          description: Indicates whether the channel's transcoder needs to run in a designated IP range.
          type: boolean
        id:
          description: External Channel ID provided at channel creation time
          examples:
          - my-channel
          minLength: 1
          pattern: ^([a-z0-9]+(-*[a-z0-9]+)*)$
          readOnly: true
          type: string
        ingest:
          $ref: '#/components/schemas/Ingest'
          description: Ingest configures inputs for the transcoder.
        labels:
          description: Optional labels for a channel. Any included labels must be at least 1 character long, but no greater than 256 characters. The maximum number of labels is 50.
          items:
            type: string
          maxItems: 50
          type:
          - array
          - 'null'
        modified:
          description: Date and time the channel was last modified.
          format: date-time
          readOnly: true
          type: string
        name:
          description: A friendly human-readable name for the channel. This will get displayed in user interfaces.
          examples:
          - My Channel
          type: string
        organization:
          minLength: 1
          type: string
        packaging:
          $ref: '#/components/schemas/Packaging'
          description: Packaging configures media format and content protection settings.
        publishing:
          $ref: '#/components/schemas/Publishing'
          description: Publishing configures playlist formats and where to send video and playlist data.
        region:
          description: Region represents the general geolocation for transcoding and stream egress from iStreamPlanet. If no region is provided at channel creation time, then 'US_WEST' is used.
          enum:
          - US_WEST
          - US_EAST
          type: string
        resource_class:
          description: If the ResourceClass is unspecified the channel will default to run in the 'DYNAMIC' ResourceClass. Note that changing the ResourceClass for a running channel is supported and will be performed with no downtime.
          enum:
          - DYNAMIC
          - STATIC
          type: string
        self:
          description: Self link for the channel.
          format: uri-reference
          readOnly: true
          type: string
        signaling:
          $ref: '#/components/schemas/Signaling'
          description: Signaling configures in-band signaling (i.e. SCTE-35).
        tags:
          $ref: '#/components/schemas/Tags'
          description: Use ChannelMetadata when possible instead of tags.
        transcode:
          $ref: '#/components/schemas/Transcode'
          description: Transcode configures audio/video conversion settings.
      required:
      - ingest
      - transcode
      type: object
    Ingest:
      additionalProperties: false
      properties:
        slate:
          additionalProperties: false
          properties:
            source_loss_url:
              description: Source loss URL defines the location of the TS file to play when no source is available. It must have one audio and one video stream. Either MPEG2 or H.264 can be used.
              examples:
              - https://example.com/slate.ts
              format: uri-reference
              type: string
          type: object
        source:
          additionalProperties: false
          properties:
            audio_sources:
              items:
                additionalProperties: false
                properties:
                  id:
                    minLength: 1
                    type: string
                  language:
                    description: RFC 5646, e.g. 'en' 'en-US'
                    minLength: 1
                    type: string
                  license:
                    description: License specifies how the audio in this source is licensed. If license is not AUDIO_LICENSE_UNSPECIFIED, any remapped AudioSource which names this AudioSource in its remapping table must have the same license value as this AudioSource.
                    enum:
                    - LIVE
                    - REPLAY
                    type: string
                  name:
                    description: Language fiendly name, e.g. 'English', 'Spanish'
                    minLength: 1
                    type: string
                  remapping:
                    additionalProperties: false
                    properties:
                      back_left:
                        additionalProperties: false
                        properties:
                          audio_source_id:
                            description: Identifies the ID of the elementary audio source from which this channel will be sourced.
                            minLength: 1
                            type: string
                          channel_index:
                            description: 'Identifies the zero-based channel index within the audio decoded from audio_source_id which is used for this channel mapping. If this index is out of bounds, the audio for this channel will be silent. For SMPTE-302M inputs, channel indices are always in the range 0-8 (unless the Aventus-specific extension for carrying more than 8 channels in one elementary stream is in use) and name the Nth channel of the input. I.e., the base channel index indicated by the input stream is ignored. For non-SMPTE-302M inputs with 1, 2, or 6 channels, the following index-to-channel mapping always applies: - 0 is front left (i.e. the only channel for mono) - 1 is front right - 2 is front center - 3 is LFE - 4 is side left - 5 is side right For non-SMPTE-302M inputs with 3, 4, or 5 channels, no index mapping is guaranteed. For non-SMPTE-302M inputs with more than 6 channels, the index mapping that would be used for 6 channels is guaranteed, and no specific mapping for the other channels is guaranteed.'
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                      back_right:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      front_center:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      front_left:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      front_right:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      low_frequency:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      side_left:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      side_right:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      top_back_left:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      top_back_right:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      top_front_left:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      top_front_right:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      top_side_left:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      top_side_right:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      wide_left:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                      wide_right:
                        $ref: '#/components/schemas/AudioSourceRemappingSource'
                    type: object
                  selector:
                    description: Expression for choosing an audio track in the stream for this AudioSource https://wbdstreaming.atlassian.net/wiki/spaces/LIVE/pages/250351679/Proposal+Audio+Track+Selection An AudioSource which specifies a selector is an 'elementary audio source' which corresponds to exactly one elementary stream in the input.
                    type: string
                type: object
              minItems: 1
              type:
              - array
              - 'null'
            captions_source:
              description: Closed captions source embedding. If unspecified, defaults to ATSC_A53.
              enum:
              - ATSC_A53
              - SMPTE_2038
              type: string
            id:
              description: Unique identifier for this source.
              examples:
              - s-examplej95ah2qab
              type: string
            self:
              description: Self link for the source.
              format: uri-reference
              type: string
            video_source:
              additionalProperties: false
              properties:
                dynamic_range:
                  description: The highest dynamic range the source will ever send to the transcoder.
                  enum:
                  - SDR
                  - HDR
                  type: string
                jpeg_xs:
                  description: If true, the source may be JPEG-XS. Enables allocation of additional resources required to handle the higher bitrate and decode JPEG-XS. If not enabled, JPEG-XS inputs will result in the source-loss slate.
                  type: boolean
                max_resolution:
                  description: The maximum resolution the source will ever send to the transcoder.
                  enum:
                  - SD
                  - HD
                  - FHD
                  - TwoK
                  - QHD
                  - UHD
                  type: string
              type: object
          required:
          - id
          type: object
      required:
      - source
      type: object
    Publishing:
      additionalProperties: false
      properties:
        closed_caption_streams:
          description: Configures how captioning information, which references CEA-608 captions embedded in video segments, is published.
          items:
            additionalProperties: false
            properties:
              auto_select:
                description: Indicates that the client should play the captioning media selection group if the user has not indicated a user preference. If both auto_select and default are not set, the first captioning media selection group will be used.
                enum:
                - 'NO'
                - 'YES'
                type: string
              default:
                description: Configures the captioning media selection group that will be played if the user has not indicated a user preference. If both auto_select and default are not set, the first captioning media selection group will be used.
                enum:
                - 'NO'
                - 'YES'
                type: string
              language:
                description: Language code as RFC 5646, e.g. 'en' 'en-US'.
                type: string
              name:
                description: Source stream name.
                type: string
            type: object
          type:
          - array
          - 'null'
        feature_flags:
          description: Set of string identifiers corresponding to features that this Channel is opting in.
          items:
            type: string
          type:
          - array
          - 'null'
        live2vod:
          additionalProperties: false
          properties:
            clear_capture:
              description: BETA - (Optional) Indicates whether the system should send the unpackaged segments produced from the transcoder to the L2V system for purposes of creating mp4s and/or repackaging.
              type: boolean
            product_id:
              description: Product ID that VODs will be associated with in the Live2VOD system. The value of this ID is pre-configured in the Live2VOD portal.
              minLength: 1
              type: string
            retention_days:
              description: Specifies the retention time, in days, for archived content.
              format: int32
              maximum: 30
              minimum: 1
              type: integer
          type: object
        publications:
          description: A set of individual configurations that each can configure a specific destination and mechanism of delivery for segments and/or playlists.
          items:
            additionalProperties: false
            properties:
              audio_encoder_ids:
                description: Optionally specify which audio encoders should be used for this publication. If none are specified, all audio encoders configured for the transcoder will be used.
                items:
                  type: string
                type:
                - array
                - 'null'
                uniqueItems: true
              create_vods:
                description: Create VODs for all publish points in this publication. Note that Live2VOD must also be configured for the parent |Channel|.
                type: boolean
              dash:
                additionalProperties: false
                properties:
                  minimum_update_period_secs:
                    description: Sets the minimumUpdatePeriod field in MPD to be this value. If set to 0 (default), segment duration is used. The value shall not exceed the 'suggested_presentation_delay_secs'.
                    format: int32
                    type: integer
                  signaling_formats:
                    description: Signaling formats specifies which SCTE-35 timeline marker formatting to use when rendering playlists.
                    items:
                      enum:
                      - SCTE35_SPLICE_INFO_SECTION
                      - SCTE35_BIN
                      type: string
                    type:
                    - array
                    - 'null'
                    uniqueItems: true
                  suggested_presentation_delay_secs:
                    description: The suggested amount of time (in seconds) the player should be behind the live stream. This value must be greater or equal to 'minimum_update_period_secs'.
                    format: int32
                    minimum: 0
                    type: integer
                  url_type:
                    description: If set to 'URL_TYPE_UNDEFINED' playlist generation will use 'RELATIVE'.
                    enum:
                    - RELATIVE
                    - ABSOLUTE
                    - HOST_RELATIVE
                    type: string
                type: object
              drms:
                description: Optionally specify which DRMs to advertise in the playlist. If specified, this must be a subset of the DRMs specified by the packager associated with this publication. If omitted or empty, all DRMs specified by the packager will be advertised. This setting can only be used for HLS playlists.
                items:
                  enum:
                  - WIDEVINE
                  - FAIRPLAY
                  - PRIMETIME
                  - PLAYREADY
                  - W3C_COMMON_CLEAR_KEY
                  - BULK_FILE
                  type: string
                type:
                - array
                - 'null'
                uniqueItems: true
              dvr_window_secs:
                description: DVR window is the max sum(duration of media segments) that will be kept in a manifest at a given time in seconds. The max supported DVR window is 10 hours.
                format: int32
                maximum: 36000
                minimum: 0
                type: integer
              fer_audio_encoder_ids:
                description: Optionally specify which audio encoders should be used when generating the FER of this Presentation, this overrides the 'audio_encoder_ids' used during the live portion. If none are specified, the 'audio_encoder_ids' field will be used.
                items:
                  type: string
                type:
                - array
                - 'null'
                uniqueItems: true
              hls:
                additionalProperties: false
                properties:
                  audio_only_variants:
