            - NETWORK
            - SLATE
            - NOT_INDICATED
            - TIMED_METADATA
            - TIMED_METADATA_MARKER_OVER_SLATE
            type: string
          type:
          - array
          - 'null'
          uniqueItems: true
      type: object
