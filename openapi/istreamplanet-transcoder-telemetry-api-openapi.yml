paths:
  /v2/scte-history:
    get:
      description: Returns the history of out-of-band SCTE-35 messages received by the transcoder for all channels.
      operationId: list-raw-scte-history
      parameters:
      - description: ISO 8601 UTC timestamp for start range of date filtering
        explode: false
        in: query
        name: from
        schema:
          description: ISO 8601 UTC timestamp for start range of date filtering
          format: date-time
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRawSCTEHistoryResponseBody'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Bad Request
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Found
        '413':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Request Entity Too Large
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
        '501':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Implemented
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Service Unavailable
      summary: Get SCTE-35 History
      tags:
      - Transcoder Telemetry
  /v2/{org}/channels/{channel-id}/content-segment-history:
    get:
      description: Returns content segment history for a channel.
      operationId: list-content-segment-history
      parameters:
      - description: Organization name
        in: path
        name: org
        required: true
        schema:
          description: Organization name
          type: string
      - description: Unique channel identifier
        in: path
        name: channel-id
        required: true
        schema:
          description: Unique channel identifier
          maxLength: 60
          pattern: ^([a-z0-9]+(-*[a-z0-9]+)*)$
          type: string
      - description: ISO 8601 UTC timestamp for start range of date filtering
        explode: false
        in: query
        name: from
        schema:
          description: ISO 8601 UTC timestamp for start range of date filtering
          format: date-time
          type: string
      - description: ISO 8601 UTC timestamp for end range of date filtering
        explode: false
        in: query
        name: to
        schema:
          description: ISO 8601 UTC timestamp for end range of date filtering
          format: date-time
          type: string
      - description: Filter by segment types. If not specified, all segment types are returned. Corresponds to the ChannelProto channeldoc.SignalingSegment ENUM names.
        explode: false
        in: query
        name: segment_types
        schema:
          description: Filter by segment types. If not specified, all segment types are returned. Corresponds to the ChannelProto channeldoc.SignalingSegment ENUM names.
          examples:
          - - PROGRAM
          items:
            type: string
          minItems: 1
          type:
          - array
          - 'null'
      - description: Type part of the UPID. Required when upid_id is provided.
        explode: false
        in: query
        name: upid_type
        schema:
          description: Type part of the UPID. Required when upid_id is provided.
          examples:
          - 12
          format: int32
          type: integer
      - description: ID part of the UPID. Accepts plain text and hex-encoded values prefixed with a 0x. Required when upid_type is provided
        explode: false
        in: query
        name: upid_id
        schema:
          description: ID part of the UPID. Accepts plain text and hex-encoded values prefixed with a 0x. Required when upid_type is provided
          examples:
          - DISC279973-169
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListContentSegmentHistoryResponseBody'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Bad Request
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Found
        '413':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Request Entity Too Large
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
        '501':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Implemented
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Service Unavailable
      summary: List Channel Content Segments History
      tags:
      - Transcoder Telemetry
