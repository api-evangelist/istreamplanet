components:
  schemas:
    ListContentSegmentHistoryResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/ListContentSegmentHistoryResponseBody.json
          format: uri
          readOnly: true
          type: string
        content_segments:
          items:
            $ref: '#/components/schemas/TranscoderContentSegment'
          type:
          - array
          - 'null'
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    TranscoderContentSegment:
      additionalProperties: false
      properties:
        end:
          description: end is the timestamp when the content segment ended.
          format: date-time
          type: string
        header:
          $ref: '#/components/schemas/TranscoderHeader'
          description: header is required for all transcoder events.
        segment_id:
          description: segment_id is a unique id assigned by the transcoder
          format: int64
          type: integer
        start:
          description: start is the timestamp when the content segment started.
          format: date-time
          type: string
        type:
          description: 'type is the type of content segment. Example: PROGRAM, CHAPTER, or BREAK.'
          enum:
          - SPLICE_INSERT
          - CONTENT_ID
          - PROGRAM
          - PROGRAM_BLACKOUT_OVERRIDE
          - PROGRAM_BREAKAWAY
          - CHAPTER
          - BREAK
          - OPENING_CREDIT
          - CLOSING_CREDIT
          - PROVIDER_PLACEMENT_OP
          - DISTRIBUTOR_PLACEMENT_OP
          - PROVIDER_OVERLAY_OP
          - DISTRIBUTOR_OVERLAY_OP
          - PROVIDER_AD
          - DISTRIBUTOR_AD
          - UNSCHEDULED_EVENT
          - NETWORK
          - SLATE
          - NOT_INDICATED
          - TIMED_METADATA
          - TIMED_METADATA_MARKER_OVER_SLATE
          type: string
        upids:
          items:
            $ref: '#/components/schemas/TranscoderUPID'
          type:
          - array
          - 'null'
      type: object
    ListRawSCTEHistoryByChannelResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/ListRawSCTEHistoryByChannelResponseBody.json
          format: uri
          readOnly: true
          type: string
        raw_scte35:
          items:
            $ref: '#/components/schemas/TranscoderRawSCTE35'
          type:
          - array
          - 'null'
      type: object
    ListRawSCTEHistoryResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/ListRawSCTEHistoryResponseBody.json
          format: uri
          readOnly: true
          type: string
        raw_scte35:
          items:
            $ref: '#/components/schemas/TranscoderRawSCTE35'
          type:
          - array
          - 'null'
      type: object
    GetChannelCostReportResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/GetChannelCostReportResponseBody.json
          format: uri
          readOnly: true
          type: string
        channel_name:
          type: string
        channel_urn:
          type: string
        duration_secs:
          format: int64
          type: integer
        external_id:
          type: string
        has_hdr:
          type: boolean
        has_realtime_output:
          type: boolean
        has_uhd:
          type: boolean
        labels:
          items:
            type: string
          type:
          - array
          - 'null'
        organization:
          type: string
        verbit_encoder_count:
          format: int32
          minimum: 0
          type: integer
      type: object
    ChannelCostReport:
      additionalProperties: false
      properties:
        channel_name:
          type: string
        channel_urn:
          type: string
        duration_secs:
          format: int64
          type: integer
        external_id:
          type: string
        has_hdr:
          type: boolean
        has_realtime_output:
          type: boolean
        has_uhd:
          type: boolean
        labels:
          items:
            type: string
          type:
          - array
          - 'null'
        organization:
          type: string
        verbit_encoder_count:
          format: int32
          minimum: 0
          type: integer
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
          - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type:
          - array
          - 'null'
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
          - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
          - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
          - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
          - https://example.com/errors/example
          format: uri
          type: string
      type: object
    TranscoderRawSCTE35:
      additionalProperties: false
      properties:
        header:
          $ref: '#/components/schemas/TranscoderHeader'
        id:
          description: id is a unique scte id assigned by the transcoder per run_id
          format: int32
          minimum: 0
          type: integer
        in_band:
          description: in_band denotes whether the SCTE-35 message was received in the source consumed by the transcoder (In-Band) or signaled via Transcoder API (Out-of-Band).
          type: boolean
        scte35:
          contentEncoding: base64
          type: string
        source:
          enum:
          - SOURCE_UNDEFINED
          - PRIMARY
          - SECONDARY
          type: string
        time:
          description: time is the time at which the SCTE was received by the transcoder.
          format: date-time
          type: string
      type: object
    TranscoderHeader:
      additionalProperties: false
      properties:
        run_id:
          format: int64
          minimum: 0
          type: integer
      type: object
    TranscoderUPID:
      additionalProperties: false
      properties:
        id:
          contentEncoding: base64
          type: string
        type:
          format: int32
          type: integer
      type: object
