components:
  schemas:
    Location:
      additionalProperties: false
      properties:
        fallback_url:
          type: string
        primary_url:
          type: string
        query_string:
          type: string
      required:
      - query_string
      - primary_url
      - fallback_url
      type: object
    EDCPartialPresentations:
      additionalProperties: false
      properties:
        presentations:
          items:
            $ref: '#/components/schemas/EDCPartialPresentation'
          type:
          - array
          - 'null'
      required:
      - presentations
      type: object
    MakeMP4ResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/MakeMP4ResponseBody.json
          format: uri
          readOnly: true
          type: string
        taskid:
          description: Task ID for makemp4 task
          type: string
      required:
      - taskid
      type: object
    ListProductsResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/ListProductsResponseBody.json
          format: uri
          readOnly: true
          type: string
        errors:
          description: Errors when fetching products
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type:
          - array
          - 'null'
        products:
          description: Product Array
          items:
            $ref: '#/components/schemas/Product'
          type:
          - array
          - 'null'
      required:
      - products
      - errors
      type: object
    GlobalArchiveSettings:
      additionalProperties: false
      properties:
        aes_key_conversion:
          type: string
        enforce_custom_mp4_path:
          type: boolean
        master_url_type:
          type: string
        media_url_type:
          type: string
        origins:
          additionalProperties:
            $ref: '#/components/schemas/client.Origin'
          type: object
        preserve_published_directory_structure:
          type: boolean
        url_type:
          type: string
      type: object
    ScteFilterOptions:
      additionalProperties: false
      properties:
        signal_removed_provider_ad:
          description: Signal removal of provider ads
          type: boolean
      required:
      - signal_removed_provider_ad
      type: object
    PackageUrls:
      additionalProperties: false
      properties:
        fallback_url:
          type: string
        primary_url:
          type: string
      required:
      - primary_url
      - fallback_url
      type: object
    ProductConfig:
      additionalProperties: false
      properties:
        archive_settings:
          $ref: '#/components/schemas/ArchiveSettings'
          description: Archive settings for collapses
        collapse_config:
          $ref: '#/components/schemas/CollapseConfig'
          description: Collapse filter options
        collapse_trigger_config:
          $ref: '#/components/schemas/CollapseTriggerConfig'
          description: Options for when to trigger collapses
        edc_partial_presentations:
          $ref: '#/components/schemas/EDCPartialPresentations'
          description: Partial presentation definitions
        edc_transcode_template:
          additionalProperties: {}
          description: Template to transcode mp4 to hls
          type: object
        notifications:
          description: Notifiaction settings for collapses
          items:
            $ref: '#/components/schemas/NotificationConfigByEventType'
          type:
          - array
          - 'null'
        region:
          description: Region represents the general geolocation the product is in.
          enum:
          - US_WEST
          - US_EAST
          type: string
        store:
          description: store for product
          type: string
        workflow_config:
          $ref: '#/components/schemas/WorkflowConfig'
          description: Config variables for workflows
      type: object
    ListProgramsResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://api.istreamplanet.com/schemas/ListProgramsResponseBody.json
          format: uri
          readOnly: true
          type: string
        errors:
          description: Errors when fetching programs
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type:
          - array
          - 'null'
        programs:
          description: Program Array
          items:
            $ref: '#/components/schemas/Program'
          type:
          - array
          - 'null'
      required:
      - programs
      - errors
      type: object
    TaskSummary:
      additionalProperties: false
      properties:
        created:
          description: when the task was created in RFC3339Nano format
          examples:
          - '2006-01-02T15:04:05.9999Z'
          format: date-time
          type: string
        done:
          description: indicates if the task is done or not
          type: boolean
        ended:
          description: when the task ended in RFC3339Nano format
          examples:
          - '2006-01-02T15:04:05.9999Z'
          format: date-time
          type: string
        error:
          description: error message if any for this task
          type: string
        failure_count:
          description: number of times the task failed
          format: int64
          type: integer
        id:
          description: ID for the task
          type: string
        params:
          description: params sent to task
          type: string
        progress:
          description: the progress of the task
          format: double
          type: number
        region:
          description: Region represents the general geolocation the task is in.
          enum:
          - US_WEST
          - US_EAST
          type: string
        self:
          description: Link to this resource
          format: uri
          readOnly: true
          type: string
        status:
          description: status for the task
          type: string
        succeeded:
          description: indicates if the task succeeded or not
          type: boolean
        type:
          description: type of task
          format: int64
          type: integer
        weight:
          description: priority
          format: int64
          type: integer
        workerVersion:
          description: the version of the worker for this task
          type: string
        worker_id:
          description: the id of the worker for the task
          format: int64
          type: integer
      required:
      - id
      - type
      - params
      - weight
      - created
      - ended
      - done
      - succeeded
      - error
      - worker_id
      - failure_count
      - status
      - progress
      - workerVersion
      type: object
    QCUPackage:
      additionalProperties: false
      properties:
        dash:
          $ref: '#/components/schemas/PackageUrls'
        hls:
          $ref: '#/components/schemas/PackageUrls'
        id:
          type: string
      required:
      - id
      type: object
    DynamicSyndicationRequest:
      additionalProperties: false
