  headers: [If-Match, If-Unmodified-Since, If-None-Match, If-Modified-Since]
  text: You may opt-in by setting the `If-Match` header to the resource's `ETag`, or the `If-Unmodified-Since` header to the resource's `Last-Modified` time.
