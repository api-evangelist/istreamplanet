aid: istreamplanet

name: iStreamPlanet

description: iStreamPlanet was a Las Vegas-based live video streaming company, founded in 2000, whose cloud-based Aventus live video workflow
  platform delivered live events and linear channels over the internet to multiple platforms and devices. Turner Broadcasting took a majority
  stake in 2015; the company later sat under WarnerMedia and then Warner Bros. Discovery, which shut it down in August 2023. Its open-source arm,
  iStreamPlanet Labs (github.com/istreamlabs), publishes Apache 2.0 projects including the rest-api-lint Spectral ruleset.

