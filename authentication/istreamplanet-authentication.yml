description: Auth is handled via the WBD Okta offering using RFC 7519 JSON Web Tokens (JWT). Clients first make a request
  to the application's WBD Okta endpoint to get a token, and then provide that token in an `Authorization` header with each
  request to the API. Tokens are short lived and a new token must be fetched when the token expires. WBD Okta supports RFC
  6749 OAuth 2.0, both the Authorization Code (with PKCE) and Client Credential grant flows.
